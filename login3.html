<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Huddle Login (Login 3)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #0b0f19;
            min-height: 100vh;
        }

        /* Top Page Navigation Switcher */
        .top-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(30, 41, 59, 0.85);
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 13px;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .top-switcher a {
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 9999px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .top-switcher a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .top-switcher a.active {
            background: #6366f1;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        /* Monster Huddle Stage */
        .stage-box {
            background-color: #EFF1F7;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .huddle-container {
            position: relative;
            width: 270px;
            height: 190px;
            perspective: 800px;
            transform-origin: bottom center;
            transition: transform 0.3s ease;
        }

        /* Individual Monsters */
        .monster {
            position: absolute;
            bottom: 0;
            transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
        }

        /* 1. Purple Monster (Back Center-Left) */
        .monster-purple {
            left: 48px;
            width: 86px;
            height: 138px;
            z-index: 10;
        }

        .flip-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .flip-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px 8px 0 0;
        }

        .flip-front {
            background: #5A44F2;
            overflow: hidden;
        }

        /* Top Highlight strip on purple */
        .flip-front::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: #7D6BFA;
            border-radius: 8px 8px 0 0;
        }

        .flip-back {
            background: #4B37D4;
            transform: rotateY(180deg);
            border-radius: 8px 8px 0 0;
        }

        .flip-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: #604AE8;
            border-radius: 8px 8px 0 0;
        }

        /* 2. Dark Monster (Middle Right) */
        .monster-dark {
            left: 116px;
            width: 58px;
            height: 105px;
            z-index: 15;
            background: #181926;
            border-radius: 18px 18px 0 0;
        }

        /* 3. Orange Monster (Front Left Dome) */
        .monster-orange {
            left: 0px;
            width: 152px;
            height: 84px;
            z-index: 25;
            background: #FA6432;
            border-radius: 84px 84px 0 0;
        }

        /* 4. Yellow Monster (Front Right Arch) */
        .monster-yellow {
            left: 158px;
            width: 72px;
            height: 82px;
            z-index: 20;
            background: #FBBF24;
            border-radius: 36px 36px 0 0;
        }

        /* Eyes & Pupils */
        .pupil {
            transition: transform 0.12s ease-out;
        }

        /* Shy State Modifiers (Triggered on password focus) */
        .stage-box.shy .flip-wrapper {
            transform: rotateY(180deg); /* Purple turns around */
        }

        .stage-box.shy .monster-dark {
            transform: translateY(32px) rotate(-8deg); /* Dark hides down */
            opacity: 0.85;
        }

        .stage-box.shy .monster-orange {
            transform: translateY(18px) scale(0.96, 0.85); /* Orange squishes down */
        }

        .stage-box.shy .monster-yellow {
            transform: translateY(28px) rotate(6deg); /* Yellow dips down */
            opacity: 0.88;
        }

        /* Responsive scaling */
        @media (max-width: 767px) {
            .huddle-container {
                transform: scale(0.85);
            }
        }

        @media (max-width: 480px) {
            .huddle-container {
                transform: scale(0.75);
            }
        }

        .input-field {
            transition: all 0.2s ease;
        }

        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 md:p-6">

    <!-- Top Navigation Switcher -->
    <div class="top-switcher">
        <a href="/login">👈 Login 1</a>
        <a href="/login2">✨ Login 2</a>
        <a href="/login3" class="active">👾 Login 3 (Huddle Monsters)</a>
    </div>

    <!-- Main Card Container -->
    <div class="bg-white rounded-3xl md:rounded-[2rem] shadow-2xl flex flex-col md:flex-row w-full max-w-[880px] overflow-hidden border border-slate-100">
        
        <!-- Left Panel: Mascot Huddle Illustration (Centered & Always in View) -->
        <div class="stage-box w-full md:w-1/2 h-[220px] sm:h-[260px] md:h-auto min-h-[220px] md:min-h-[500px]" id="stage">
            
            <div class="huddle-container">
                
                <!-- 1. PURPLE MONSTER (Back Center-Left) -->
                <div class="monster monster-purple">
                    <div class="flip-wrapper">
                        <!-- Front Face -->
                        <div class="flip-face flip-front">
                            <svg viewBox="0 0 86 138" width="86" height="138" class="w-full h-full">
                                <!-- Eyes (Two small dark dots) -->
                                <circle cx="28" cy="46" r="3.5" fill="#181926" class="pupil" />
                                <circle cx="58" cy="46" r="3.5" fill="#181926" class="pupil" />
                                <!-- Mouth (Surprised 'o' mouth) -->
                                <circle cx="43" cy="62" r="4" fill="#181926" />
                            </svg>
                        </div>
                        <!-- Back Face (When shy/turned around) -->
                        <div class="flip-face flip-back flex flex-col items-center justify-center">
                            <div class="w-8 h-1 bg-[#3A29B0] rounded-full opacity-60"></div>
                        </div>
                    </div>
                </div>

                <!-- 2. DARK MONSTER (Center-Right Pill) -->
                <div class="monster monster-dark">
                    <svg viewBox="0 0 58 105" width="58" height="105" class="w-full h-full">
                        <!-- Left Big Eye -->
                        <circle cx="20" cy="36" r="8" fill="#FFFFFF" />
                        <circle cx="20" cy="36" r="3.5" fill="#181926" class="pupil" />
                        <!-- Right Big Eye -->
                        <circle cx="39" cy="36" r="8" fill="#FFFFFF" />
                        <circle cx="39" cy="36" r="3.5" fill="#181926" class="pupil" />
                    </svg>
                </div>

                <!-- 3. ORANGE MONSTER (Front-Left Dome) -->
                <div class="monster monster-orange">
                    <svg viewBox="0 0 152 84" width="152" height="84" class="w-full h-full">
                        <!-- Eyes (Two beady dark dots) -->
                        <circle cx="48" cy="42" r="4.5" fill="#181926" class="pupil" />
                        <circle cx="94" cy="42" r="4.5" fill="#181926" class="pupil" />
                        <!-- Smile Crescent Mouth -->
                        <path d="M 64 52 Q 71 63 78 52 Z" fill="#181926" />
                    </svg>
                </div>

                <!-- 4. YELLOW MONSTER (Front-Right Arch) -->
                <div class="monster monster-yellow">
                    <svg viewBox="0 0 72 82" width="72" height="82" class="w-full h-full">
                        <!-- Eye (Small dot) -->
                        <circle cx="48" cy="30" r="3.5" fill="#181926" class="pupil" />
                        <!-- Straight Quirky Mouth Line (Sticking slightly out) -->
                        <path d="M 38 46 L 72 46" stroke="#181926" stroke-width="4.5" stroke-linecap="round" />
                    </svg>
                </div>

            </div>

        </div>

        <!-- Right Panel: Login Form -->
        <div class="w-full md:w-1/2 p-6 sm:p-8 md:p-12 flex flex-col justify-center bg-white">
            
            <div class="mb-6">
                <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-1.5">Welcome back</h2>
                <p class="text-slate-500 text-sm">Please enter your details.</p>
            </div>

            <form id="login-form" class="space-y-4">
                
                <!-- Email Input -->
                <div class="space-y-1">
                    <label for="email" class="text-xs font-semibold text-slate-700 uppercase tracking-wider">Email</label>
                    <input type="email" id="email" 
                        class="input-field w-full px-3.5 py-2.5 sm:py-3 rounded-xl border border-slate-200 outline-none text-slate-800 text-sm bg-white" 
                        placeholder="you@example.com" required autocomplete="off">
                </div>

                <!-- Password Input -->
                <div class="space-y-1">
                    <label for="password" class="text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    <input type="password" id="password" 
                        class="input-field w-full px-3.5 py-2.5 sm:py-3 rounded-xl border border-slate-200 outline-none text-slate-800 text-sm bg-white" 
                        placeholder="••••••••" required>
                </div>

                <!-- Actions -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                        <span class="text-xs sm:text-sm text-slate-600 group-hover:text-slate-800 transition-colors">Remember for 30 days</span>
                    </label>
                    <a href="#" class="text-xs sm:text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors" id="forgotLink">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-[#181926] hover:bg-slate-900 text-white font-semibold py-3 sm:py-3.5 rounded-xl transition-all shadow-md shadow-slate-900/10 mt-3 active:scale-[0.99] text-sm sm:text-base">
                    Log in
                </button>

                <!-- Divider -->
                <div class="relative flex items-center py-1">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-3 text-slate-400 text-xs uppercase font-semibold">Or</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- Google Button -->
                <button type="button" id="googleBtn" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold py-2.5 sm:py-3 rounded-xl transition-all flex items-center justify-center space-x-2 text-sm shadow-sm active:scale-[0.99]">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23.7449 12.27C23.7449 11.48 23.6749 10.73 23.5549 10H12.2148V14.51H18.7248C18.4348 15.99 17.5848 17.24 16.3248 18.09V21.09H20.1848C22.4748 18.98 23.7449 15.9 23.7449 12.27Z" fill="#4285F4"/>
                        <path d="M12.2148 24C15.4548 24 18.1648 22.92 20.1848 21.09L16.3248 18.09C15.2448 18.81 13.8448 19.25 12.2148 19.25C9.07484 19.25 6.41484 17.13 5.45484 14.29H1.48486V17.37C3.45486 21.3 7.50484 24 12.2148 24Z" fill="#34A853"/>
                        <path d="M5.45484 14.29C5.19484 13.57 5.05484 12.8 5.05484 12C5.05484 11.2 5.19484 10.43 5.45484 9.71V6.63H1.48486C0.674863 8.24 0.214844 10.06 0.214844 12C0.214844 13.94 0.674863 15.76 1.48486 17.37L5.45484 14.29Z" fill="#FBBC05"/>
                        <path d="M12.2148 4.75C13.9748 4.75 15.5648 5.36 16.8048 6.54L20.2648 3.08C18.1548 1.12 15.4548 0 12.2148 0C7.50484 0 3.45486 2.7 1.48486 6.63L5.45484 9.71C6.41484 6.87 9.07484 4.75 12.2148 4.75Z" fill="#EA4335"/>
                    </svg>
                    <span>Log in with Google</span>
                </button>
            </form>

            <p class="text-center text-xs sm:text-sm text-slate-500 mt-6">
                Don't have an account? <a href="#" class="font-semibold text-indigo-600 hover:underline">Sign up</a>
            </p>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.getElementById('stage');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const pupils = document.querySelectorAll('.pupil');
            const form = document.getElementById('login-form');
            const submitBtn = document.getElementById('submitBtn');

            // --- ANIMATION 1: Eye Tracking on Email Input ---
            emailInput.addEventListener('input', (e) => {
                const textLength = e.target.value.length;
                
                // Maximum pixel movement for pupils
                const maxMove = 6;
                let ratio = Math.min(textLength / 22, 1);
                
                // Calculate X movement
                let moveX = (ratio * (maxMove * 2)) - maxMove;
                let moveY = 1.5; // Slight downward look towards the input

                if (textLength === 0) {
                    moveX = 0;
                    moveY = 0;
                }

                pupils.forEach(pupil => {
                    pupil.style.transform = `translate(${moveX}px, ${moveY}px)`;
                });
            });

            // Ensure stage is normal when focusing on email
            emailInput.addEventListener('focus', () => {
                stage.classList.remove('shy');
            });

            // --- ANIMATION 2: Shy/Hide reaction on Password Focus ---
            passwordInput.addEventListener('focus', () => {
                stage.classList.add('shy');
                
                // Center pupils when hiding
                pupils.forEach(pupil => {
                    pupil.style.transform = `translate(0px, 0px)`;
                });
            });

            // Revert state when clicking outside password field
            passwordInput.addEventListener('blur', () => {
                stage.classList.remove('shy');
                
                // Return eyes to text position if email has text
                if (emailInput.value.length > 0 && document.activeElement !== emailInput) {
                    emailInput.dispatchEvent(new Event('input'));
                }
            });

            // Form Submit handler
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                alert(`Welcome back! Successfully logged in as: ${emailInput.value}`);
            });

            document.getElementById('googleBtn').addEventListener('click', () => {
                alert('Google authentication triggered (Demo)');
            });

            document.getElementById('forgotLink').addEventListener('click', (e) => {
                e.preventDefault();
                alert('Password reset instructions sent (Demo)');
            });
        });
    </script>
</body>
</html>
